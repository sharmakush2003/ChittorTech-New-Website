services:
  - type: web
    name: chittortech-whatsapp-bot
    env: node
    region: singapore
    plan: free
    buildCommand: npm install --legacy-peer-deps && node -e "const {execSync}=require('child_process');execSync('npx puppeteer browsers install chrome',{cwd:'node_modules/whatsapp-web.js',stdio:'inherit',env:{...process.env,PUPPETEER_CACHE_DIR:'/opt/render/.cache/puppeteer'}})"
    startCommand: node server.js
    envVars:
      - key: PORT
        value: 10000
      - key: USE_MONGODB
        value: "true"
      - key: MONGODB_URI
        sync: false
      - key: SERVER_URL
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: "llama-3.3-70b-versatile"
